name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Placeholders so `next build` can evaluate config and auth setup without real services.
  # No process connects to a database during the build.
  APP_URL: http://localhost:3000
  NEXT_PUBLIC_APP_URL: http://localhost:3000
  BETTER_AUTH_URL: http://localhost:3000
  BETTER_AUTH_SECRET: ci-placeholder-secret-not-used-anywhere-0123456789
  DATABASE_URL: postgres://postgres:postgres@localhost:5432/ume
  DISCORD_CLIENT_ID: '000000000000000000'
  NEXT_PUBLIC_DISCORD_CLIENT_ID: '000000000000000000'
  S3_ENDPOINT: https://example.r2.cloudflarestorage.com
  S3_REGION: auto
  S3_BUCKET: ume
  S3_ACCESS_KEY_ID: ci
  S3_SECRET_ACCESS_KEY: ci
  CEO_EMAILS: ci@example.com
  EMAIL_FROM: Ume <no-reply@example.com>
  CRON_SECRET: ci
  TURBO_TELEMETRY_DISABLED: '1'
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  verify:
    name: Typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        # Version comes from the `packageManager` field in package.json.
        uses: pnpm/action-setup@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

  docker:
    name: Docker image (${{ matrix.app }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        app: [bot, worker]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for Dockerfile
        id: dockerfile
        run: |
          if [ -f "apps/${{ matrix.app }}/Dockerfile" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::apps/${{ matrix.app }}/Dockerfile not found; skipping image build"
          fi

      - name: Set up Docker Buildx
        if: steps.dockerfile.outputs.present == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        if: steps.dockerfile.outputs.present == 'true'
        uses: docker/build-push-action@v6
        with:
          # Build context is the repo root so the Dockerfile can copy the pnpm workspace.
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: false
          load: false
          tags: ume-${{ matrix.app }}:ci
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
